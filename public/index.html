<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Школа №1 — Главная</title>
  <!-- Важно: ведущий слэш /css/style.css -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="/" class="logo">
        <span class="logo-text">Школа №1</span>
      </a>
      <div id="userBlock" class="user-info">
        <span id="userName">👋 Гость</span>
        <button id="logoutBtn" class="btn-logout">Выйти</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <h1 id="welcomeText" class="main-title">Привет!</h1>
    <p class="subtitle">Все уроки и задания за 1 класс собраны здесь</p>

    <div id="progressBox" class="progress-card" style="display: none; margin: 16px 0;">
      <p id="progressText">0 из 0 уроков пройдено 0%</p>
    </div>

    <div id="subjectsList" class="subjects-grid" style="margin-top: 24px;">
      <!-- Предметы подгружаются из index.js -->
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
