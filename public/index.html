<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damir Online School — Главная</title>
  <!-- Важно: ведущий слэш /css/style.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="/" class="logo">
        <span class="logo-badge">🎓</span>
        <span class="logo-text">Damir Online School</span>
      </a>
      <div id="userBlock" class="user-info">
        <span id="userName">👋 Гость</span>
        <button id="logoutBtn" class="btn-logout" style="display:none;">Выйти</button>
        <a id="loginBtn" href="/login.html" class="btn-primary btn-sm" style="display:none;">Войти</a>
      </div>
    </div>
  </header>

  <main class="main-container">
    <h1 id="welcomeText" class="main-title">Привет!</h1>
    <p class="subtitle">Все уроки и задания за 1 класс собраны здесь</p>

    <div id="progressBox" class="progress-card" style="display: none;">
      <div id="progressText">0 из 0 уроков пройдено</div>
    </div>

    <section id="monthlyProgressBox" class="monthly-progress-card" style="display: none;" aria-labelledby="monthlyProgressTitle">
      <div class="monthly-progress-heading">
        <div>
          <span class="subject-eyebrow">Текущий календарный месяц</span>
          <h2 id="monthlyProgressTitle">Результаты за месяц</h2>
        </div>
        <div class="score-badge"><strong id="monthlyScore">0</strong><span>/ 100</span></div>
      </div>
      <div class="monthly-stats-grid">
        <div><strong id="monthlyLessons">0</strong><span>уроков завершено</span></div>
        <div><strong id="monthlyTasks">0</strong><span>задач решено</span></div>
        <div class="stat-correct"><strong id="monthlyCorrect">0</strong><span>верно</span></div>
        <div class="stat-partial"><strong id="monthlyPartial">0</strong><span>частично</span></div>
        <div class="stat-incorrect"><strong id="monthlyIncorrect">0</strong><span>неверно</span></div>
      </div>
    </section>

    <div id="subjectsList" class="subjects-grid"></div>

    <section class="calendar-section" aria-labelledby="calendarTitle">
      <div class="calendar-toolbar">
        <div>
          <span class="subject-eyebrow">Расписание занятий</span>
          <h2 id="calendarTitle">Календарь на неделю</h2>
          <p id="calendarWeekTitle" class="calendar-week-title"></p>
        </div>
        <div class="calendar-controls" aria-label="Переключение недель">
          <button id="calendarPrevWeek" class="calendar-nav-btn" type="button" aria-label="Предыдущая неделя">←</button>
          <button id="calendarToday" class="calendar-today-btn" type="button">Сегодня</button>
          <button id="calendarNextWeek" class="calendar-nav-btn" type="button" aria-label="Следующая неделя">→</button>
        </div>
      </div>

      <p id="calendarStatus" class="calendar-status" aria-live="polite"></p>
      <div id="calendarScroll" class="calendar-scroll" tabindex="0" aria-label="Недельное расписание, прокручивается по горизонтали и вертикали">
        <div id="weeklyCalendar" class="weekly-calendar" role="grid"></div>
      </div>
    </section>
  </main>

  <script>
    // Если страница восстановлена из кэша браузера (кнопка "назад") —
    // перезапрашиваем актуальное состояние вместо показа устаревшего.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) window.location.reload();
    });
  </script>
  <script src="/js/api.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
