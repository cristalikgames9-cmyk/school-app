<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damir Online School — Урок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="/" class="logo"><span class="logo-badge">🎓</span><span class="logo-text">Damir Online School</span></a>
    </div>
  </header>

  <main class="main-container">
    <!-- Ссылка ведет напрямую на страницу предмета -->
    <a id="backToSubjectLink" href="/" class="back-link">← Назад к предмету</a>
    
    <h1 id="lessonTitle" class="main-title" style="margin-top: 16px;">Загрузка урока...</h1>

    <div class="video-container" id="videoBox" style="display: none;">
      <iframe id="lessonVideo" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <div id="lessonDescription" class="lesson-text"></div>

    <!-- Карточка перехода к ДЗ -->
    <div class="hw-banner-card">
      <div class="hw-banner-info">
        <h3>Домашнее задание</h3>
        <p id="hwStatsText">Проверьте знания по пройденному материалу</p>
      </div>
      <a id="hwBtn" href="#" class="btn-primary">Перейти к ДЗ →</a>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/lesson.js"></script>
</body>
</html>
