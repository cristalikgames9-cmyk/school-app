<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Урок — Школа №1</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="/" class="logo">
        <span class="dots">
          <span class="dot blue"></span>
          <span class="dot red"></span>
          <span class="dot green"></span>
        </span>
        <span class="logo-text">Школа №1</span>
      </a>
    </div>
  </header>

  <main class="main-container">
    <a href="javascript:history.back()" class="back-link">← Назад к предмету</a>
    
    <h1 id="lessonTitle" class="main-title" style="margin-top: 16px;">Загрузка урока...</h1>

    <!-- Видеоплеер -->
    <div class="video-container" id="videoBox" style="display: none;">
      <iframe id="lessonVideo" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- Текст урока -->
    <div id="lessonDescription" class="lesson-text"></div>

    <!-- Задания -->
    <div id="tasksSection" class="tasks-section"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/lesson.js"></script>

</html>
