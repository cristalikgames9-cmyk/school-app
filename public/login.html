<script>
  // Если страница входа восстановлена из кэша браузера (кнопка "назад")
  // после того как мы уже вошли — перезапрашиваем состояние.
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) window.location.reload();
  });

  let currentMode = 'login';

  // Если пользователь уже вошёл — форма входа ему не нужна
  fetch('/api/auth/me', { 
    cache: 'no-store',
    credentials: 'include' 
  })
    .then((r) => r.json())
    .then((data) => {
      if (data.user) window.location.replace('/index.html');
    })
    .catch(() => {});

  function switchTab(mode) {
    currentMode = mode;
    const loginBtn = document.getElementById('loginTabBtn');
    const registerBtn = document.getElementById('registerTabBtn');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    if (mode === 'login') {
      loginBtn.classList.add('active');
      registerBtn.classList.remove('active');
      submitBtn.textContent = 'Войти';
    } else {
      registerBtn.classList.add('active');
      loginBtn.classList.remove('active');
      submitBtn.textContent = 'Зарегистрироваться';
    }
  }

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    if (username.length < 4 || username.length > 12 || password.length < 4 || password.length > 12) {
      errorMsg.textContent = 'Логин и пароль должны быть от 4 до 12 символов!';
      errorMsg.style.display = 'block';
      return;
    }

    const endpoint = currentMode === 'login' ? '/api/auth/login' : '/api/auth/register';

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
        cache: 'no-store',
        credentials: 'include'
      });

      const data = await res.json();

      if (res.ok) {
        window.location.replace('/index.html');
      } else {
        errorMsg.textContent = data.error || 'Произошла ошибка';
        errorMsg.style.display = 'block';
      }
    } catch (err) {
      errorMsg.textContent = 'Ошибка соединения с сервером';
      errorMsg.style.display = 'block';
    }
  });
</script>
